services:
  athl-database:
    image: postgres:16-alpine
    container_name: athl-database
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - athl_postgres_data:/var/lib/postgresql/data
    networks:
      - applications-network

  athl-database-ihm:
    image: adminer:4.8.1-standalone
    container_name: athl-database-ihm
    restart: always
    networks:
      - applications-network

volumes:
  athl_postgres_data:

networks:
  applications-network:
    external: true
    name: applications-network