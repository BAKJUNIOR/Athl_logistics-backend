<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changement de statut de votre compte</title>
    <style>
        body {
            font-family: 'Lato', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        table {
            border-collapse: collapse !important;
        }
        img {
            display: block;
            border: 0;
        }
        .email-container {
            max-width: 600px;
            margin: auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(14, 14, 14, 0.1);
            overflow: hidden;
        }
        .content {
            padding: 30px;
        }
        .content h2 {
            font-size: 22px;
            color: #111111;
        }
        .content p {
            font-size: 16px;
            line-height: 24px;
            margin-bottom: 20px;
        }
        .footer {
            background-color: #f4f4f4;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #666666;
        }
        .footer a {
            color: #102793;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="email-container">
    <div class="content">
        <h2>Changement de statut de votre compte</h2>
        <p>Cher(e) <span th:text="${firstName}"></span>,</p>
        <p>Votre compte a été <span th:text="${status}"></span>.</p>
        <p>Raison : <span th:text="${reason}"></span></p>
        <p>Si vous avez des questions, veuillez contacter l'administration.</p>
        <p>Cordialement,<br/>L'équipe Athl-Logistics</p>
    </div>

    <div class="footer">
        <p>Si vous avez des questions, veuillez nous contacter à <a href="mailto:contact@athl-logistics.ci">contact@athl-logistics.ci</a>.</p>
    </div>
</div>
</body>

</html>
