<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informations de votre compte</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f7; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
<center style="width: 100%; background-color: #f4f4f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f4f4f7;">
    <tr>
        <td align="center" style="padding: 24px 16px;">
            <table role="presentation" width="460" cellpadding="0" cellspacing="0" border="0" align="center"
                   style="max-width: 460px; width: 100%; margin: 0 auto; background-color: #ffffff; border: 1px solid #e7e5ef; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 10px rgba(93,67,146,0.08);">
                <tr>
                    <td th:replace="~{fragments/email-common :: accent-bar}"></td>
                </tr>
                <tr>
                    <td th:replace="~{fragments/email-common :: header}"></td>
                </tr>
                <tr>
                    <td style="padding: 16px 24px 0; text-align: center;">
                        <h2 style="margin: 0 0 16px; font-size: 20px; color: #5d4392; font-weight: 700;">
                            Votre compte a été créé
                        </h2>
                        <p style="margin: 0 0 24px; font-size: 14px; line-height: 22px; color: #4b4756;">
                            Bonjour <span th:text="${firstName}">Utilisateur</span>,<br/>
                            votre compte <strong th:text="${userType}">Type de compte</strong> a été créé avec succès sur le back-office Athl Logistics. Voici vos informations de connexion :
                        </p>

                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin: 0 0 24px;">
                            <tr>
                                <td align="center" style="background-color: #f3effa; border: 1px solid #d9cdec; border-radius: 10px; padding: 14px;">
                                    <p style="margin: 0 0 6px; font-size: 14px; color: #1a1523;">
                                        <span th:text="${email}">Votre email</span>
                                    </p>
                                    <p style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #4c3778; font-family: 'Courier New', monospace;">
                                        <span th:text="${password}">Votre mot de passe</span>
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 0 0 8px; font-size: 14px; line-height: 22px; color: #4b4756;">
                            Connectez-vous avec ces identifiants, puis changez votre mot de passe depuis « Mon profil ».
                        </p>
                    </td>
                </tr>
                <tr>
                    <td th:replace="~{fragments/email-common :: footer}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</center>
</body>
</html>
